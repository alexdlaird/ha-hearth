name: Release

run-name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_file: 'custom_components/hearth/manifest.json'
      version_pattern: 's/"version": ".*"/"version": "${VERSION}"/'
      repo_slug: alexdlaird/ha-hearth
      changelog: true
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  finish:
    needs: [prereq]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-finish.yml@main
    with:
      shipped: true
      version: ${{ needs.prereq.outputs.version }}
      squash_commit_sha: ${{ needs.prereq.outputs.squash_commit_sha }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
      build_run_id: ${{ needs.prereq.outputs.build_run_id }}
      version_file: 'custom_components/hearth/manifest.json'
      version_pattern: 's/"version": ".*"/"version": "${VERSION}"/'
      repo_slug: alexdlaird/ha-hearth
      github_release: true
      github_release_notes: ${{ needs.prereq.outputs.release_notes }}
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
