[project]
name = "ha-hearth"
version = "0.0.0"
description = "A Home Assistant integration for Hearth; room-based comfort for the thermostat Home Assistant already controls"
readme = "README.md"
license = "MIT"
keywords = ["home-assistant", "hacs", "hearth", "thermostat", "climate", "room-sensors", "matter"]
authors = [{ name = "Alex Laird", email = "contact@alexlaird.com" }]
maintainers = [{ name = "Alex Laird", email = "contact@alexlaird.com" }]
requires-python = ">=3.13.2"
dependencies = [
    "pyhearth==1.0.0"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Plugins",
    "Framework :: AsyncIO",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation"
]

[project.optional-dependencies]
dev = [
    "pytest-homeassistant-custom-component==0.13.357; python_version >= '3.14'",
    "coverage[toml]",
    "flake8",
    "flake8-pyproject",
    "pep8-naming",
    "mypy",
]

[project.urls]
Changelog = "https://github.com/alexdlaird/ha-hearth/blob/main/CHANGELOG.md"
Documentation = "https://github.com/alexdlaird/ha-hearth#readme"
Sponsor = "https://github.com/sponsors/alexdlaird"
"Source Code" = "https://github.com/alexdlaird/ha-hearth"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
junit_family = "legacy"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--ignore=venv",
    "--durations=0",
    "--durations-min=2",
    "--junitxml=build/test-results/junit.xml"
]

[tool.coverage.run]
omit = [
    "venv/**",
    "*/tests/**"
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.coverage.xml]
output = "build/coverage/coverage.xml"

[tool.coverage.html]
title = "Coverage Report"
directory = "build/coverage"

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "."

[tool.flake8]
max-line-length = 119
statistics = true
exclude = "venv/*,build/*,dist/*,.egg-info/*"
